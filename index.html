<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusFlow</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="eyebrow">FocusFlow / Utility lab</div><h1>FocusFlow</h1><p>Make the next 25 minutes count. A simple focus space for studying and working.</p></header><div class="grid"><section class="panel"><h2>Focus timer</h2><label for="mode">Session type</label><select id="mode"><option value="focus">Focus · 25 min</option><option value="short">Short break · 5 min</option><option value="long">Long break · 15 min</option></select><div class="metric" id="clock" style="font-size:64px">25:00</div><progress id="progress" max="100" value="0"></progress><div><button id="toggle">Start</button><button class="secondary" id="reset">Reset</button></div><p id="status" role="status"></p></section><section class="panel"><h2>Progress</h2><div class="muted">Completed focus sessions</div><div class="metric" id="sessions">0</div><div class="muted">Tasks completed</div><div class="metric" id="count">0 / 0</div></section></div><section class="panel"><h2>Task checklist</h2><form id="taskform"><label for="task">Add a task</label><input id="task" required maxlength="150" placeholder="Review SQL joins"><button>Add task</button></form><div id="tasks"></div><p id="storage" role="status"></p></section><footer>Runs locally in your browser · No server required</footer></main><script src="core.js"></script><script src="app.js"></script></body></html>
